<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember Duel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316172b'/%3E%3Cpath d='M16 5l3 8 8 3-8 3-3 8-3-8-8-3 8-3z' fill='%23ffcb88'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="festival" aria-hidden="true"></canvas>
  <main id="game" aria-label="Ember Duel"></main>
  <script>
    // Chrome blocks local module fetches from file URLs. The bundled entry
    // uses the same rules, artwork, and interface for direct offline play.
    const entry = document.createElement('script');
    if (location.protocol === 'file:') {
      entry.src = './src/offline.js';
    } else {
      entry.type = 'module';
      entry.src = './src/main.js';
    }
    document.head.append(entry);
  </script>
</body>
</html>
